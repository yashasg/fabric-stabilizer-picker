<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Embroidery hoop app icon with a minimalist floral design in Madder Clay">
  <title>Fabric Stabilizer Picker — embroidery app icon</title>

  <defs>
    <!-- Linen fabric gradient -->
    <linearGradient id="linen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EFE2"/>
      <stop offset="1" stop-color="#EDE3D1"/>
    </linearGradient>
    <!-- Wooden hoop gradient -->
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C79A63"/>
      <stop offset="0.5" stop-color="#B5854E"/>
      <stop offset="1" stop-color="#9E703D"/>
    </linearGradient>
    <!-- Brass gradient -->
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B873"/>
      <stop offset="1" stop-color="#B08E45"/>
    </linearGradient>
    <!-- Soft inner shadow for fabric inside hoop -->
    <radialGradient id="hoopInner" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0.7" stop-color="#F4ECDD"/>
      <stop offset="1" stop-color="#E7DAC4"/>
    </radialGradient>
  </defs>

  <!-- Madder Clay accent: #A6442E , soft sage leaf: #8C9A6A -->

  <!-- Fabric square -->
  <rect x="64" y="64" width="896" height="896" rx="168" fill="url(#linen)"/>

  <!-- Dashed running-stitch border in Madder Clay -->
  <rect x="132" y="132" width="760" height="760" rx="120" fill="none"
        stroke="#A6442E" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="36 40"/>

  <!-- Brass tension screw at top of hoop -->
  <g>
    <rect x="476" y="150" width="72" height="64" rx="10" fill="url(#brass)"/>
    <rect x="466" y="138" width="44" height="40" rx="8" fill="url(#brass)"/>
    <line x1="520" y1="170" x2="610" y2="170" stroke="#B08E45" stroke-width="10" stroke-linecap="round"/>
    <g stroke="#9A7A3A" stroke-width="6" stroke-linecap="round">
      <line x1="530" y1="160" x2="530" y2="182"/>
      <line x1="552" y1="158" x2="552" y2="184"/>
      <line x1="574" y1="158" x2="574" y2="184"/>
      <line x1="596" y1="160" x2="596" y2="182"/>
    </g>
  </g>

  <!-- Wooden embroidery hoop -->
  <circle cx="512" cy="540" r="318" fill="url(#wood)"/>
  <circle cx="512" cy="540" r="262" fill="url(#hoopInner)"/>

  <!-- ===== Minimalistic floral spray (replaces the "e") ===== -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Central stem -->
    <path d="M512 700 C 512 620, 512 560, 512 470" stroke="#8C9A6A" stroke-width="11"/>

    <!-- Left curving stem with leaves -->
    <path d="M512 660 C 450 640, 410 600, 392 540" stroke="#8C9A6A" stroke-width="10"/>
    <path d="M448 632 C 420 612, 408 590, 404 566 C 432 574, 450 596, 460 624 Z" fill="#8C9A6A" stroke="none"/>
    <path d="M412 588 C 390 576, 380 558, 378 538 C 402 548, 414 566, 420 588 Z" fill="#9CAA78" stroke="none"/>

    <!-- Right curving stem with leaves -->
    <path d="M512 660 C 574 640, 614 600, 632 540" stroke="#8C9A6A" stroke-width="10"/>
    <path d="M576 632 C 604 612, 616 590, 620 566 C 592 574, 574 596, 564 624 Z" fill="#8C9A6A" stroke="none"/>
    <path d="M612 588 C 634 576, 644 558, 646 538 C 622 548, 610 566, 604 588 Z" fill="#9CAA78" stroke="none"/>

    <!-- Lower leaf pair on central stem -->
    <path d="M512 690 C 484 678, 470 660, 466 638 C 492 648, 506 666, 512 690 Z" fill="#9CAA78" stroke="none"/>
    <path d="M512 690 C 540 678, 554 660, 558 638 C 532 648, 518 666, 512 690 Z" fill="#9CAA78" stroke="none"/>
  </g>

  <!-- Madder Clay flowers (French-knot style centers + simple petals) -->
  <!-- Top main flower -->
  <g>
    <g fill="#A6442E">
      <circle cx="512" cy="442" r="26"/>
      <circle cx="512" cy="400" r="22"/>
      <circle cx="470" cy="430" r="22"/>
      <circle cx="554" cy="430" r="22"/>
      <circle cx="484" cy="468" r="22"/>
      <circle cx="540" cy="468" r="22"/>
    </g>
    <circle cx="512" cy="438" r="18" fill="#C56A4E"/>
    <circle cx="512" cy="438" r="8" fill="#7E3120"/>
  </g>

  <!-- Left berry/flower -->
  <g>
    <circle cx="388" cy="530" r="22" fill="#A6442E"/>
    <circle cx="388" cy="530" r="9" fill="#7E3120"/>
  </g>
  <!-- Right berry/flower -->
  <g>
    <circle cx="636" cy="530" r="22" fill="#A6442E"/>
    <circle cx="636" cy="530" r="9" fill="#7E3120"/>
  </g>
  <!-- Small accent buds -->
  <circle cx="470" cy="612" r="14" fill="#C56A4E"/>
  <circle cx="554" cy="612" r="14" fill="#C56A4E"/>

  <!-- ===== Needle and thread ===== -->
  <g>
    <!-- Thread loop in Madder Clay -->
    <path d="M690 470 C 760 500, 770 590, 712 660 C 678 700, 700 740, 740 752"
          fill="none" stroke="#A6442E" stroke-width="12" stroke-linecap="round"/>
    <!-- Needle -->
    <line x1="746" y1="430" x2="700" y2="752" stroke="url(#brass)" stroke-width="14" stroke-linecap="round"/>
    <!-- Needle eye -->
    <ellipse cx="749" cy="438" rx="14" ry="22" fill="none" stroke="url(#brass)" stroke-width="9" transform="rotate(8 749 438)"/>
  </g>
</svg>
